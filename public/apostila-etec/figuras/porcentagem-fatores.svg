<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" aria-labelledby="t d"><title id="t">Fatores de aumento e de desconto</title><desc id="d">Uma barra representa 100 por cento. Um aumento de 20 por cento leva a 120 por cento, fator 1,20. Um desconto de 20 por cento leva a 80 por cento, fator 0,80.</desc><style>text{font-family:Georgia,serif;fill:#2f403a}.m{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.04em}</style><rect width="560" height="230" fill="#fbf7ef"/><g transform="translate(40 30)"><text class="m" x="0" y="0">VALOR INICIAL · 100%</text><rect x="0" y="10" width="300" height="22" fill="none" stroke="#2f403a"/><text class="m" x="0" y="72">AUMENTO DE 20% · ×1,20</text><rect x="0" y="82" width="300" height="22" fill="none" stroke="#2f403a"/><rect x="300" y="82" width="60" height="22" fill="#bd945c"/><text x="375" y="99" font-size="15">120%</text><text class="m" x="0" y="144">DESCONTO DE 20% · ×0,80</text><rect x="0" y="154" width="240" height="22" fill="none" stroke="#2f403a"/><rect x="240" y="154" width="60" height="22" fill="none" stroke="#b6271f" stroke-dasharray="3 3"/><text x="315" y="171" font-size="15">80%</text></g></svg>

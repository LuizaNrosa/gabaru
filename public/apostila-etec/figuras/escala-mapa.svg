<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-labelledby="t d"><title id="t">Escala gráfica e escala numérica</title><desc id="d">Barra de escala dividida em quatro partes de 1 centímetro, cada uma valendo 5 quilômetros no terreno, e a escala numérica equivalente 1 para 500 000.</desc><style>text{font-family:Georgia,serif;fill:#2f403a}.m{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.04em}</style><rect width="560" height="200" fill="#fbf7ef"/><g transform="translate(60 70)"><rect x="0" y="0" width="80" height="14" fill="#2f403a"/><rect x="80" y="0" width="80" height="14" fill="#fbf7ef" stroke="#2f403a"/><rect x="160" y="0" width="80" height="14" fill="#2f403a"/><rect x="240" y="0" width="80" height="14" fill="#fbf7ef" stroke="#2f403a"/><g class="m" text-anchor="middle"><text x="0" y="38">0</text><text x="80" y="38">5</text><text x="160" y="38">10</text><text x="240" y="38">15</text><text x="320" y="38">20 km</text></g><path d="M0 -18h80" stroke="#b6271f" stroke-width="1"/><path d="M0 -23v10M80 -23v10" stroke="#b6271f" stroke-width="1"/><text x="40" y="-28" text-anchor="middle" class="m" style="fill:#b6271f">1 cm</text></g><text x="60" y="160" font-size="17">1 cm no mapa = 5 km no terreno = 500 000 cm</text><text x="60" y="186" class="m" style="fill:#bd945c">ESCALA NUMÉRICA 1 : 500 000</text></svg>

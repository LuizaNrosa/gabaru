name: Validar acervo oficial
on:
  pull_request:
    paths: ['src/data/*-exams.json', 'src/data/enem-cadernos-paginados.json', 'src/data/acervo-parts.json', 'public/acervo/**', 'acervo-parts/**', 'scripts/**', 'tests/**', '.github/workflows/acervo.yml']
  push:
    branches: [main]
    paths: ['src/data/*-exams.json', 'src/data/enem-cadernos-paginados.json', 'src/data/acervo-parts.json', 'public/acervo/**', 'acervo-parts/**', 'scripts/**', 'tests/**', '.github/workflows/acervo.yml']
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run validar:licencas
      - run: node scripts/restore-acervo-parts.mjs
      - run: node scripts/prepare-enem.mjs
      - run: node scripts/prepare-etec.mjs --paginar
      - run: npm test
      - run: node scripts/prepare-coluni.mjs

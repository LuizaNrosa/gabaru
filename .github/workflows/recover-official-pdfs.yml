name: Recuperar PDFs oficiais conferidos
on:
  pull_request:
    paths: ['scripts/vendor-official-pdfs.py', '.github/workflows/recover-official-pdfs.yml']
permissions:
  contents: write
concurrency:
  group: recover-official-pdfs-${{ github.head_ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/vendor-official-pdfs.py
      - run: node scripts/restore-acervo-parts.mjs && node --test tests/*.test.mjs
      - name: Commit verified originals to the pull request branch
        run: |
          git add public/acervo
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Vendor exact official PDFs after SHA256 verification'
          git push

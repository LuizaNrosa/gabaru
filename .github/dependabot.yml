version: 2
updates:
  # Dependências de produção e dev do site (Next, Firebase, Stripe, Zod…).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # O PR #110 consolidou a árvore: majors exigem migração separada.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
      - dependency-name: eslint
        versions: [">=10.0.0"]
      # Compatibilidade legada: mantenha correções minor/patch de segurança.
      - dependency-name: stripe
        update-types: ["version-update:semver-major"]
    groups:
      menor-patch:
        update-types:
          - "minor"
          - "patch"

  # O próprio GitHub Actions (checkout, setup-node).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-labelledby="t d"><title id="t">Semelhança de triângulos com sombras</title><desc id="d">Um poste de 6 metros projeta sombra de 4 metros, e uma vara de 1,5 metro projeta sombra de 1 metro no mesmo instante. Os triângulos formados são semelhantes.</desc><style>text{font-family:Georgia,serif;fill:#2f403a;font-size:15px}.m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#bd945c;letter-spacing:.04em}</style><rect width="560" height="250" fill="#fbf7ef"/><path d="M40 200 H520" stroke="#2f403a" stroke-width="1"/><path d="M80 200 V60" stroke="#2f403a" stroke-width="2"/><path d="M80 60 L173 200" stroke="#bd945c" stroke-width="1" stroke-dasharray="4 3"/><path d="M80 200 H173" stroke="#b6271f" stroke-width="2"/><path d="M360 200 V165" stroke="#2f403a" stroke-width="2"/><path d="M360 165 L383 200" stroke="#bd945c" stroke-width="1" stroke-dasharray="4 3"/><path d="M360 200 H383" stroke="#b6271f" stroke-width="2"/><text x="70" y="130" text-anchor="end">6 m</text><text x="126" y="222" text-anchor="middle">4 m</text><text x="350" y="186" text-anchor="end">1,5 m</text><text x="372" y="222" text-anchor="middle">1 m</text><text class="m" x="230" y="70">MESMO SOL, MESMO ÂNGULO</text><text x="230" y="98" font-size="17">6 ÷ 4 = 1,5 ÷ 1</text><text x="230" y="124" font-size="14">altura e sombra são proporcionais</text></svg>

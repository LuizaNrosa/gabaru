name: Validar acervo oficial
on:
  pull_request:
    paths: ['src/data/*-exams.json', 'src/data/acervo-parts.json', 'public/acervo/**', 'acervo-parts/**', 'scripts/**', 'tests/**', '.github/workflows/acervo.yml']
  push:
    branches: [main]
    paths: ['src/data/*-exams.json', 'src/data/acervo-parts.json', 'public/acervo/**', 'acervo-parts/**', 'scripts/**', 'tests/**', '.github/workflows/acervo.yml']
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/restore-acervo-parts.mjs
      - run: node --test tests/*.test.mjs
      - run: node scripts/prepare-coluni.mjs

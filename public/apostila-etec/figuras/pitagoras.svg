<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" aria-labelledby="t d"><title id="t">Teorema de Pitágoras</title><desc id="d">Triângulo retângulo com catetos 3 e 4 e hipotenusa 5, com o ângulo reto marcado, e a relação a ao quadrado igual a b ao quadrado mais c ao quadrado.</desc><style>text{font-family:Georgia,serif;fill:#2f403a;font-size:16px}.m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#bd945c;letter-spacing:.04em}</style><rect width="560" height="260" fill="#fbf7ef"/><path d="M60 200 L240 200 L60 65 Z" fill="none" stroke="#2f403a" stroke-width="1"/><path d="M60 182 H78 V200" fill="none" stroke="#b6271f" stroke-width="1"/><text x="150" y="225" text-anchor="middle">cateto c = 4</text><text x="52" y="140" text-anchor="end">cateto b = 3</text><text x="165" y="122" fill="#b6271f" style="fill:#b6271f">hipotenusa a = 5</text><text class="m" x="300" y="90">NO TRIÂNGULO RETÂNGULO</text><text x="300" y="120" font-size="20">a² = b² + c²</text><text x="300" y="155">5² = 3² + 4²</text><text x="300" y="180">25 = 9 + 16</text><text x="300" y="215" font-size="14">A hipotenusa fica oposta ao ângulo reto</text><text x="300" y="235" font-size="14">e é sempre o maior lado.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-labelledby="t d"><title id="t">Volume do prisma e do cilindro</title><desc id="d">Um paralelepípedo e um cilindro. O volume dos dois é a área da base vezes a altura. No cilindro, a área da base é pi vezes o raio ao quadrado.</desc><style>text{font-family:Georgia,serif;fill:#2f403a;font-size:15px}.m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#bd945c;letter-spacing:.04em}</style><rect width="560" height="240" fill="#fbf7ef"/><g fill="none" stroke="#2f403a" stroke-width="1"><path d="M40 170 h120 v-80 h-120 Z"/><path d="M40 90 l30 -25 h120 l-30 25"/><path d="M190 65 v80 l-30 25"/><ellipse cx="380" cy="70" rx="55" ry="15"/><path d="M325 70 V170 M435 70 V170"/><path d="M325 170 A55 15 0 0 0 435 170"/></g><path d="M380 70 H435" stroke="#b6271f" stroke-width="1"/><text x="402" y="64" style="fill:#b6271f">r</text><text x="100" y="192" text-anchor="middle">a</text><text x="182" y="166">b</text><text x="22" y="135">c</text><text x="450" y="125">h</text><text class="m" x="40" y="215">PRISMA · V = a · b · c</text><text class="m" x="325" y="215">CILINDRO · V = π · r² · h</text></svg>

version: 2
updates:
  # Dependências de produção e dev do site (Next, Firebase, Stripe, Zod…).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # O PR #110 consolidou a árvore: majors exigem migração separada.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
      - dependency-name: eslint
        versions: [">=10.0.0"]
      # Compatibilidade legada: mantenha correções minor/patch de segurança.
      - dependency-name: stripe
        update-types: ["version-update:semver-major"]
    groups:
      menor-patch:
        update-types:
          - "minor"
          - "patch"

  # App Android (Expo) em APK/: lockfile próprio, também escaneado no CI.
  - package-ecosystem: npm
    directory: /APK
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      apk-menor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions (checkout, setup-node, codeql, trivy...). As Actions estão
  # fixadas por SHA; o Dependabot atualiza o SHA e o comentário da tag juntos.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

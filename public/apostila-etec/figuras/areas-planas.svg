<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="t d"><title id="t">Fórmulas de área das figuras planas</title><desc id="d">Retângulo de base b e altura h com área b vezes h; triângulo com área b vezes h dividido por 2; trapézio com área base maior mais base menor vezes h dividido por 2; círculo de raio r com área pi r ao quadrado.</desc><style>text{font-family:Georgia,serif;fill:#2f403a;font-size:15px}.m{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#bd945c;letter-spacing:.04em}.h{stroke:#b6271f;stroke-width:1;stroke-dasharray:3 3}</style><rect width="560" height="300" fill="#fbf7ef"/><g fill="none" stroke="#2f403a" stroke-width="1"><rect x="30" y="40" width="100" height="60"/><path d="M180 100 L280 100 L235 40 Z"/><path d="M330 100 L430 100 L405 40 L355 40 Z"/><circle cx="500" cy="70" r="32"/></g><path class="h" d="M235 40 V100"/><path class="h" d="M380 40 V100"/><path d="M500 70 H532" stroke="#b6271f" stroke-width="1"/><text x="80" y="122" text-anchor="middle">b</text><text x="18" y="75">h</text><text x="230" y="122" text-anchor="middle">b</text><text x="242" y="76">h</text><text x="380" y="122" text-anchor="middle">B</text><text x="380" y="34" text-anchor="middle">b</text><text x="386" y="76">h</text><text x="512" y="64">r</text><text class="m" x="80" y="160" text-anchor="middle">RETÂNGULO</text><text x="80" y="185" text-anchor="middle">A = b · h</text><text class="m" x="230" y="160" text-anchor="middle">TRIÂNGULO</text><text x="230" y="185" text-anchor="middle">A = b · h ÷ 2</text><text class="m" x="380" y="160" text-anchor="middle">TRAPÉZIO</text><text x="380" y="185" text-anchor="middle">A = (B + b) · h ÷ 2</text><text class="m" x="500" y="160" text-anchor="middle">CÍRCULO</text><text x="500" y="185" text-anchor="middle">A = π · r²</text><text x="30" y="250" font-size="14">A altura (tracejada) é sempre perpendicular à base.</text><text x="30" y="274" font-size="14">Perímetro é a soma dos lados; no círculo, C = 2 · π · r.</text></svg>
